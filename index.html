<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>AuraTrade · Alertas de mercado explicadas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app-container">

  <header class="header">
    <img class="logo" alt="AuraTrade" src="logo.webp">
    <div class="status-badge connecting" id="data-status" role="status">Conectando…</div>
  </header>

  <!-- VISTA 1: ALERTAS -->
  <main id="tab-alertas" class="tab-content active">
    <div class="section-title">Alertas del motor de reglas</div>
    <div class="filter-chips" role="group" aria-label="Filtrar alertas">
      <button class="filter-chip active" data-filter="all">Todas</button>
      <button class="filter-chip" data-filter="watch">Mi cartera</button>
    </div>
    <div class="feed-meta" id="alerts-meta">Analizando velas de 1 hora…</div>
    <div class="feed" id="alerts-feed"></div>
    <p class="disclaimer">AuraTrade emite alertas informativas generadas por reglas técnicas sobre datos públicos. No son recomendaciones de compra o venta ni constituyen asesoramiento financiero.</p>
  </main>

  <!-- VISTA 2: MERCADOS -->
  <section id="tab-mercado" class="tab-content">
    <div class="search-container">
      <input type="search" id="search" class="search-bar" placeholder="Buscar activo o ticker (ej. SOL, PEPE)" autocomplete="off">
      <div id="search-suggestion" class="search-suggestion" hidden></div>
    </div>

    <div class="market-toggle" role="tablist">
      <button class="toggle-btn" data-market="stocks" role="tab">Wall Street</button>
      <button class="toggle-btn active" data-market="crypto" role="tab">Criptoactivos</button>
    </div>

    <div id="list-stocks" class="asset-list" hidden>
      <div id="stock-notice" class="notice" hidden></div>
      <div id="stock-cards"></div>
    </div>
    <div id="list-crypto" class="asset-list"></div>
  </section>

  <!-- VISTA 3: CARTERA -->
  <section id="tab-cartera" class="tab-content">
    <div class="section-title">Mi cartera</div>
    <div id="watch-list" class="asset-list"></div>
  </section>

  <!-- VISTA 4: AJUSTES -->
  <section id="tab-ajustes" class="tab-content">
    <div class="section-title">Fuentes y método</div>
    <div id="settings"></div>
  </section>

  <nav class="bottom-nav">
    <button class="nav-item active" data-tab="alertas"><span class="nav-icon">⚡</span><span>Alertas</span></button>
    <button class="nav-item" data-tab="mercado"><span class="nav-icon">📊</span><span>Mercados</span></button>
    <button class="nav-item" data-tab="cartera"><span class="nav-icon">⭐</span><span>Cartera</span></button>
    <button class="nav-item" data-tab="ajustes"><span class="nav-icon">⚙️</span><span>Ajustes</span></button>
  </nav>

</div>

<script src="js/config.js"></script>
<script src="js/indicators.js"></script>
<script src="js/engine.js"></script>
<script src="js/app.js"></script>
</body>
</html>
